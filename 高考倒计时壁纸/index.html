<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>高考倒计时</title>
<style>
  body, html {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  .bg-image {
    background-image: url('background.png');
    background-size: cover;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .countdown-container {
    font-size: 100px;
    font-weight: bold;
    letter-spacing: normal;
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 20;
  }
  .countdown {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 20px;
    color: #fff;
    font-family: 'Arial', sans-serif;
    transform: scale(1.1);
  }
  .countdown > span {
    display:block;
    margin-top: -5px;
  }

</style>
</head>
<body>
<div class="bg-image"></div>
<div class="countdown-container">
  <div class="countdown" id="clock">高考倒计时壁纸<br/>正在启动
    <span style="font-size: 40px">
      <span style="display:inline-block;white-space:nowrap;">技术支持联系邮箱:<span style='color: pink;'>a@狂.cn</span>B站:<span style='color: pink;'>沃梦FullDream</span></span>
    </span>
  </div>
</div>
<script>
  const clockDom = document.getElementById("clock");

  function getExamDate() {
    const now = new Date();
    const y = now.getFullYear();
    const cutoff = new Date(y, 5, 9, 23, 59, 59);
    let targetYear;
    if (now > cutoff) {
      targetYear = y + 1;
    } else {
      targetYear = y;
    }
    return new Date(targetYear, 5, 7, 0, 0, 0);
  }

  function updateCountdown() {
    const examDate = getExamDate();
    const now = new Date();
    const distance = examDate - now;
    const totalDay = distance / (1000 * 60 * 60 * 24);
    const days = Math.floor(totalDay);
    const decimal = (totalDay - days).toFixed(4);
    clockDom.innerText = `${examDate.getFullYear()}高考倒计时\n` + days + "." + decimal.slice(2) + ' 天';
  }
  setTimeout(()=>{updateCountdown();setInterval(updateCountdown,1000);},15000);
</script>
</body>
</html>
